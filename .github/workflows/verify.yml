name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify

  container-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose model
        run: docker compose -f compose.yaml -f compose.test.yaml config --quiet
      - name: Build API image
        run: docker buildx build --load --target production --file infra/docker/api.Dockerfile --tag ai-hub-api:${{ github.sha }} .
      - name: Build worker image
        run: docker buildx build --load --target production --file infra/docker/worker.Dockerfile --tag ai-hub-worker:${{ github.sha }} .
      - name: Build Web image
        run: docker buildx build --load --target production --file infra/docker/web.Dockerfile --tag ai-hub-web:${{ github.sha }} .
