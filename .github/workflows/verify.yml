name: Verify

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # test:api-data 走真实 PostgreSQL（testcontainers 或 TEST_DATABASE_URL）。
    # 不提供该service 的话 verify 会检测不到容器运行时并跳过该套件——
    # 也就是回到2026-10-08 之前的状态：授权类缺陷长期无人发现。
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: ai_hub_test
          POSTGRES_USER: ai_hub
          POSTGRES_PASSWORD: ai_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_hub -d ai_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ai_hub:ai_hub_test@localhost:5432/ai_hub_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production release contract
        run: node scripts/production/release-gate.mjs --contract
      - name: Validate production rollback contract (dry-run forward-fix; NO_AUTOMATIC_DOWN_MIGRATION)
        run: node scripts/production/rollback-gate.mjs --contract --dry-run --mode=forward-fix
      - name: Verify
        run: pnpm verify

  container-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose model
        run: docker compose -f compose.yaml -f compose.test.yaml config --quiet
      - name: Build API image
        run: docker buildx build --load --provenance=mode=max --sbom=true --target production --file infra/docker/api.Dockerfile --tag ai-hub-api:${{ github.sha }} .
      - name: Build worker image
        run: docker buildx build --load --provenance=mode=max --sbom=true --target production --file infra/docker/worker.Dockerfile --tag ai-hub-worker:${{ github.sha }} .
      - name: Build Web image
        run: docker buildx build --load --provenance=mode=max --sbom=true --target production --file infra/docker/web.Dockerfile --tag ai-hub-web:${{ github.sha }} .
