name: ai-hub-production

x-production-environment: &production-environment
  NODE_ENV: production
  API_PORT: "3000"
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  DATABASE_URL_FILE: /run/secrets/database_url
  COOKIE_SECRET_FILE: /run/secrets/cookie_secret
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_LEASE_DURATION_MS: ${OUTBOX_LEASE_DURATION_MS:-900000}
  WORKER_METRICS_PORT: "9464"
  ARTIFACT_UPLOAD_ENABLED: "false"
  ARTIFACT_MAX_SIZE_BYTES: "67108864"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command: ["postgres", "-c", "config_file=/etc/postgresql/production.conf"]
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${POSTGRES_CONFIG_FILE:?POSTGRES_CONFIG_FILE is required}:/etc/postgresql/production.conf:ro
      - ${PG_HBA_FILE:?PG_HBA_FILE is required}:/etc/postgresql/pg_hba.production.conf:ro
      - ${WAL_ARCHIVE_PATH:?WAL_ARCHIVE_PATH is required}:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [application]

  garage:
    image: ${GARAGE_IMAGE:?GARAGE_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/garage_admin_token
      GARAGE_DEFAULT_ACCESS_KEY_FILE: /run/secrets/garage_access_key
      GARAGE_DEFAULT_SECRET_KEY_FILE: /run/secrets/garage_secret_key
      GARAGE_METRICS_TOKEN_FILE: /run/secrets/garage_metrics_token
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
    secrets:
      - garage_admin_token
      - garage_access_key
      - garage_secret_key
      - garage_metrics_token
      - garage_rpc_secret
    volumes:
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ${GARAGE_CONFIG_FILE:?GARAGE_CONFIG_FILE is required}:/etc/garage.toml:ro
    networks: [application]

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    volumes:
      - clamav-definitions:/var/lib/clamav
    networks: [application]

  api:
    image: ${API_IMAGE:?API_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment: *production-environment
    secrets: [database_url, cookie_secret]
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/internal/health/live').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [application]

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      <<: *production-environment
      DATABASE_URL_FILE: /run/secrets/worker_database_url
    secrets: [worker_database_url, cookie_secret]
    depends_on:
      api:
        condition: service_healthy
    expose: ["9464"]
    networks: [application]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["80"]
    networks: [application]

  proxy:
    image: ${PROXY_IMAGE:?PROXY_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_HOSTNAME
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    secrets: [tls_certificate, tls_private_key]
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./infra/docker/nginx.production.conf:/etc/nginx/templates/default.conf.template:ro
    networks: [application]

  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - prometheus-data:/prometheus
      - ./infra/monitoring/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules/production-alerts.yml:/etc/prometheus/rules/production-alerts.yml:ro
    networks: [application]

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:?POSTGRES_EXPORTER_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME_FILE: /run/secrets/postgres_exporter_dsn
    secrets: [postgres_exporter_dsn]
    expose: ["9187"]
    networks: [application]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?ALERTMANAGER_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose: ["9093"]
    networks: [application]

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose: ["3000"]
    networks: [application]

  loki:
    image: ${LOKI_IMAGE:?LOKI_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - loki-data:/loki
      - ./infra/monitoring/loki/local-config.yml:/etc/loki/local-config.yml:ro
    expose: ["3100"]
    networks: [application]

  promtail:
    image: ${PROMTAIL_IMAGE:?PROMTAIL_IMAGE must be a digest-pinned image}
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/run/promtail
      - ./infra/monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
    depends_on:
      loki:
        condition: service_started
    networks: [application]

volumes:
  postgres-data:
  garage-metadata:
  garage-data:
  clamav-definitions:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  application:
    internal: true

secrets:
  database_url:
    file: ${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}
  worker_database_url:
    file: ${WORKER_DATABASE_URL_FILE:?WORKER_DATABASE_URL_FILE is required}
  cookie_secret:
    file: ${COOKIE_SECRET_FILE:?COOKIE_SECRET_FILE is required}
  db_password:
    file: ${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}
  garage_admin_token:
    file: ${GARAGE_ADMIN_TOKEN_FILE:?GARAGE_ADMIN_TOKEN_FILE is required}
  garage_access_key:
    file: ${GARAGE_ACCESS_KEY_FILE:?GARAGE_ACCESS_KEY_FILE is required}
  garage_secret_key:
    file: ${GARAGE_SECRET_KEY_FILE:?GARAGE_SECRET_KEY_FILE is required}
  garage_metrics_token:
    file: ${GARAGE_METRICS_TOKEN_FILE:?GARAGE_METRICS_TOKEN_FILE is required}
  garage_rpc_secret:
    file: ${GARAGE_RPC_SECRET_FILE:?GARAGE_RPC_SECRET_FILE is required}
  tls_certificate:
    file: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
  tls_private_key:
    file: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
  postgres_exporter_dsn:
    file: ${POSTGRES_EXPORTER_DSN_FILE:?POSTGRES_EXPORTER_DSN_FILE is required}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}
