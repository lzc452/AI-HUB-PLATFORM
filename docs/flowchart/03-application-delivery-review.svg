<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4a5e" /></marker></defs>
<rect width="1900" height="1300" fill="#ffffff" />
<g id="s"><ellipse cx="170" cy="75" rx="130" ry="35" fill="#d5e8d4" stroke="#82b366" stroke-width="2" /><text x="170" y="79.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="170" dy="0">创建应用草稿（所有员工）</tspan></text></g>
<g id="p1"><rect x="40" y="150" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="190.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">填写应用信息与素材</tspan><tspan x="200" dy="19">图标 / 封面 / 截图 / 简介 / 风险声明</tspan></text></g>
<g id="p2"><rect x="40" y="290" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="330.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">选择应用类型并配置交付物</tspan><tspan x="200" dy="19">Web / 桌面 / 移动 / 小程序</tspan></text></g>
<g id="p3"><rect x="40" y="430" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="470.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">分片上传与隔离</tspan><tspan x="200" dy="19">quarantine / 计算 SHA-256</tspan></text></g>
<g id="d1"><polygon points="180,570 320,620 180,670 40,620" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="180" y="624.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="180" dy="0">自动校验通过？</tspan></text></g>
<g id="p4"><rect x="40" y="730" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="180" y="774.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="180" dy="0">提交进入人工审核池</tspan></text></g>
<g id="p5"><rect x="40" y="860" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="900.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">审核任务领取</tspan><tspan x="200" dy="19">超时自动释放 / 超管可转交</tspan></text></g>
<g id="p6"><rect x="40" y="1000" width="340" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="210" y="1040.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="210" dy="0">审核详情：新旧版本差异 / 自动校验与安全报告 / 风险</tspan><tspan x="210" dy="19">声明</tspan></text></g>
<g id="d2"><polygon points="560,1000 690,1050 560,1100 430,1050" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="560" y="1054.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="560" dy="0">审核结论？</tspan></text></g>
<g id="p7"><rect x="760" y="900" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="900" y="944.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="900" dy="0">通过 → 自动上架</tspan></text></g>
<g id="p8"><rect x="760" y="1060" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="900" y="1104.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="900" dy="0">驳回（必填原因）</tspan></text></g>
<g id="p9"><rect x="760" y="1180" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="900" y="1224.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="900" dy="0">提交者撤回（审核通过前可撤回）</tspan></text></g>
<g id="bad"><rect x="440" y="570" width="420" height="150" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="650" y="630.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="650" dy="0">自动校验拒绝：扩展名 / MIME / 文件头不符、超过大小限制、压缩</tspan><tspan x="650" dy="19">炸弹或无法扫描 → 隔离；</tspan><tspan x="650" dy="19">恶意软件 → 拒绝并告警；无效签名 → 拒绝</tspan></text></g>
<g id="r1"><rect x="1220" y="150" width="360" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1400" y="199.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1400" dy="0">已上架版本不可变（不可原地修改）</tspan></text></g>
<g id="r2"><rect x="1220" y="300" width="360" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1400" y="349.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1400" dy="0">新版本提交：基于当前版本新建草稿</tspan></text></g>
<g id="r3"><rect x="1220" y="450" width="420" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1430" y="504.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1430" dy="0">新版本审核通过 → 原子替换当前版本（旧版继续可用）</tspan></text></g>
<g id="r4"><rect x="1220" y="610" width="340" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1390" y="654.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1390" dy="0">历史版本永久保留</tspan></text></g>
<g id="r5"><rect x="1220" y="750" width="400" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1420" y="800.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1420" dy="0">下架 / 归档（必填原因）</tspan><tspan x="1420" dy="19">责任人/管理员可立即执行，维护人需申请</tspan></text></g>
<g id="r6"><rect x="1220" y="920" width="400" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1420" y="970.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1420" dy="0">删除保护与审计</tspan><tspan x="1420" dy="19">审核通过后不可物理删除；独立审计不随业务删除</tspan></text></g>
<g id="r7"><rect x="1220" y="1090" width="420" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1430" y="1140.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1430" dy="0">通知矩阵：待审 / 通过 / 驳回 / 下架 / 检测失败 / 待移交</tspan><tspan x="1430" dy="19">（站内 + 钉钉）</tspan></text></g>
