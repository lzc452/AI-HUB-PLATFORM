<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4a5e" /></marker></defs>
<rect width="1900" height="1300" fill="#ffffff" />
<g id="r1"><rect x="1200" y="120" width="560" height="150" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="7,5" /><text x="1214" y="146" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d2433">需求状态机：草稿 → 待审核 → 待认领 → 已认领 → 方案验证中 → 试点中 → 已转化 / 已关闭</text></g>
<g id="s"><ellipse cx="170" cy="75" rx="130" ry="35" fill="#d5e8d4" stroke="#82b366" stroke-width="2" /><text x="170" y="79.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="170" dy="0">提交创新需求</tspan></text></g>
<g id="p1"><rect x="40" y="150" width="360" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="220" y="195.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="220" dy="0">需求表单：业务场景 / 当前流程 / 痛点 / 影响对象与频率</tspan><tspan x="220" dy="19">/ 期望结果</tspan><tspan x="220" dy="19">替代方案 / 数据类型与敏感度 / 受众范围</tspan></text></g>
<g id="p2"><rect x="40" y="330" width="360" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="220" y="379.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="220" dy="0">轻量审核（创新运营管理员，SLA 1 个工作日）</tspan></text></g>
<g id="d1"><polygon points="190,480 340,530 190,580 40,530" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="190" y="534.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="190" dy="0">审核结果？</tspan></text></g>
<g id="p3"><rect x="40" y="640" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="689.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">待认领（全员可提交方案并表达偏好）</tspan></text></g>
<g id="p4"><rect x="40" y="790" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="839.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">运营确认认领（指定负责人 + 协作者）</tspan></text></g>
<g id="p5"><rect x="40" y="930" width="320" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="969.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">方案验证</tspan></text></g>
<g id="d2"><polygon points="190,1050 340,1100 190,1150 40,1100" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="190" y="1104.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="190" dy="0">试点结果？</tspan></text></g>
<g id="p6"><rect x="420" y="1050" width="360" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="600" y="1090.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="600" dy="0">已转化为应用</tspan><tspan x="600" dy="19">需求 ↔ 应用多对多关联</tspan></text></g>
<g id="p7"><rect x="420" y="1190" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="560" y="1234.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="560" dy="0">已关闭（未转化 / 试点未达预期）</tspan></text></g>
<g id="p8"><rect x="440" y="480" width="280" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="580" y="529.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="580" dy="0">已驳回（必填原因，可修改后重新提交）</tspan></text></g>
<g id="p9"><rect x="440" y="630" width="280" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="580" y="674.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="580" dy="0">已合并（重复需求合并，双源版本保护）</tspan></text></g>
<g id="r2"><rect x="1200" y="330" width="560" height="130" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1480" y="399.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1480" dy="0">互动与治理：点赞 / 匿名展示 / 一层讨论 / 举报（实名审计）</tspan></text></g>
<g id="r3"><rect x="1200" y="520" width="560" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1480" y="579.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1480" dy="0">通知：审核结果 / 认领 / 状态变化（站内 + 钉钉）</tspan></text></g>
<g id="r4"><rect x="1200" y="690" width="560" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1480" y="754.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1480" dy="0">并发保护与审计：合并 / 认领 / 状态推进均有并发与审计</tspan></text></g>
<g id="r5"><rect x="1200" y="870" width="560" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1480" y="929.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1480" dy="0">长期无进展或负责人退出 → 可重新分配</tspan></text></g>
<g id="r6"><rect x="1200" y="1040" width="560" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1480" y="1104.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1480" dy="0">需求与应用多对多关联（主要解决方案唯一约束）</tspan></text></g>
