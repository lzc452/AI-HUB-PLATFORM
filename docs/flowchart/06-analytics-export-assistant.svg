<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4a5e" /></marker></defs>
<rect width="1900" height="1100" fill="#ffffff" />
<g id="s"><ellipse cx="180" cy="80" rx="140" ry="40" fill="#d5e8d4" stroke="#82b366" stroke-width="2" /><text x="180" y="75.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="180" dy="0">用户行为产生（浏览 / 跳转 / 下载 / 二维码</tspan><tspan x="180" dy="19">展示）</tspan></text></g>
<g id="p1"><rect x="40" y="180" width="320" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="234.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">行为事件采集：幂等写入 / UTC 分表 / 180 天保留</tspan></text></g>
<g id="p2"><rect x="40" y="340" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="389.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">日聚合任务（12 版指标口径字典 → 预聚合表）</tspan></text></g>
<g id="p3"><rect x="40" y="490" width="360" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="220" y="540.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="220" dy="0">固定看板：平台 / 市场 / 应用 / 创新 / 审核 / 部门 / 风</tspan><tspan x="220" dy="19">险 / 运维</tspan></text></g>
<g id="p4"><rect x="40" y="660" width="360" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="220" y="714.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="220" dy="0">权限控制：责任人仅聚合数据，禁止查看个人访问名单</tspan></text></g>
<g id="d1"><polygon points="190,820 340,870 190,920 40,870" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="190" y="874.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="190" dy="0">导出或问答？</tspan></text></g>
<g id="p5"><rect x="420" y="700" width="380" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="610" y="754.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="610" dy="0">后台导出：逐行审计 / 下载归属校验 / 短期授权地址</tspan></text></g>
<g id="p6"><rect x="420" y="880" width="420" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="630" y="920.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="630" dy="0">Dify 最小化问答：脱敏（无工号 / 内网 URL / 文件 / 二维码 / 匿</tspan><tspan x="630" dy="19">名身份）</tspan><tspan x="630" dy="19">+ 权限复核 + 降级 fallback</tspan></text></g>
<g id="r1"><rect x="1200" y="160" width="520" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1460" y="219.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1460" dy="0">指标口径字典（12 版，可重算）</tspan></text></g>
<g id="r2"><rect x="1200" y="340" width="520" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1460" y="395.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1460" dy="0">看板图表：折线 / 横向柱状 / 漏斗 / 热力</tspan><tspan x="1460" dy="19">空状态与表格替代视图</tspan></text></g>
<g id="r3"><rect x="1200" y="540" width="520" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1460" y="594.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1460" dy="0">导出行为全部审计（查询人 / 时间 / 范围）</tspan></text></g>
<g id="r4"><rect x="1200" y="710" width="520" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1460" y="759.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1460" dy="0">长期保留：日聚合指标长期保留</tspan></text></g>
<g id="r5"><rect x="1200" y="870" width="520" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1460" y="929.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1460" dy="0">外部依赖降级：Dify 不可用 → 助手不可用，看板与导出继续</tspan></text></g>
