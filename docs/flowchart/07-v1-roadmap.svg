<g id="ph7"><rect x="960" y="260" width="420" height="130" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><text x="1170" y="320.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1170" dy="0">Phase 7 · 生产安全、部署与运维（第 8 月）</tspan><tspan x="1170" dy="18">双机 Compose / 备份恢复 / 监控告警</tspan></text></g>
