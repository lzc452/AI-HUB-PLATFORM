<g id="ph1"><rect x="40" y="70" width="420" height="130" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><text x="250" y="130.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="250" dy="0">Phase 1 · 工程基础与可运行骨架（第 1 月）</tspan><tspan x="250" dy="18">monorepo / Compose / CI / 数据库基线</tspan></text></g>
<g id="ph2"><rect x="500" y="70" width="420" height="130" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><text x="710" y="130.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="710" dy="0">Phase 2 · 身份、组织与授权（第 2 月）</tspan><tspan x="710" dy="18">账密 + 钉钉 OAuth / 组织同步 / RBAC</tspan></text></g>
<g id="ph3"><rect x="960" y="70" width="420" height="130" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><text x="1170" y="130.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1170" dy="0">Phase 3 · 应用、版本、交付与审核（第 3–4 月）</tspan><tspan x="1170" dy="18">四类应用 / 上传扫描 / 审核池 / 上下架</tspan></text></g>
