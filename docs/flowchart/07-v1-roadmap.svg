<g id="ph5"><rect x="40" y="260" width="420" height="130" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><text x="250" y="320.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="250" dy="0">Phase 5 · AI 需求与创新广场（第 6 月）</tspan><tspan x="250" dy="18">需求表单 / 轻量审核 / 认领 / 试点</tspan></text></g>
