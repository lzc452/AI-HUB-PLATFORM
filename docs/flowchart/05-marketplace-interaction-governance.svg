<g id="p3"><rect x="40" y="610" width="360" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="220" y="650.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="220" dy="0">搜索：PostgreSQL 中文模糊 / 拼音全拼 / 首字母</tspan><tspan x="220" dy="19">（权限条件随查询）</tspan></text></g>
<g id="p4"><rect x="40" y="760" width="320" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="804.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">应用详情：版本 / 风险声明 / 交付入口</tspan></text></g>
<g id="p5"><rect x="40" y="900" width="340" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="210" y="949.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="210" dy="0">交付入口：Web 跳转 / 安装包下载 / 小程序二维码</tspan></text></g>
