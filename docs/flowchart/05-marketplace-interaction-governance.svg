<g id="r3"><rect x="1100" y="470" width="400" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1300" y="519.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1300" dy="0">官方回复（仅责任人 / 维护人，回复一层）</tspan></text></g>
<g id="r4"><rect x="1100" y="620" width="400" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1300" y="664.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1300" dy="0">举报（员工 / 应用团队；举报不自动隐藏）</tspan></text></g>
<g id="r5"><rect x="1100" y="760" width="420" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1310" y="814.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1310" dy="0">管理员处理：驳回举报 / 隐藏 / 恢复（隐藏 ≠ 删除）</tspan></text></g>
<g id="r6"><rect x="1100" y="920" width="440" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1320" y="979.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1320" dy="0">审计：匿名身份仅超级管理员高权限可查，查询行为本身入审计</tspan></text></g>
