<g id="r1"><rect x="1100" y="160" width="400" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="1300" y="204.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="1300" dy="0">点赞（可取消，仅显示总数）</tspan></text></g>
