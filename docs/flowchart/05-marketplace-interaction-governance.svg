<g id="p1"><rect x="40" y="160" width="320" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" /><text x="200" y="200.05" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="200" dy="0">受众权限过滤</tspan><tspan x="200" dy="19">全员 / 指定部门含子部门 / 指定员工</tspan></text></g>
<g id="d1"><polygon points="180,310 320,355 180,400 40,355" fill="#fff2cc" stroke="#d6b656" stroke-width="2" /><text x="180" y="359.55" font-family="Microsoft YaHei, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="middle"><tspan x="180" dy="0">在受众范围内？</tspan></text></g>
