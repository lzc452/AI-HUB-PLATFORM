server:
  http_listen_port: 9080
positions:
  filename: /run/promtail/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            message: log
      - replace:
          expression: '(?i)(password|secret|token|cookie|authorization|employee[_ -]?id)\s*[:=]\s*[^\s,;]+'
          replace: "$1=[Redacted]"
