global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/production-alerts.yml

scrape_configs:
  - job_name: ai-hub-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:3000"]
  - job_name: ai-hub-worker
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["worker:9464"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: garage
    metrics_path: /metrics
    static_configs:
      - targets: ["garage:3903"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
