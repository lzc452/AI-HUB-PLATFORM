server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 204;
  }

  location = /console {
    return 308 /console/;
  }

  location = /console/index.html {
    rewrite ^/console/index\.html$ /index.html break;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /console/ {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location /console/assets/ {
    rewrite ^/console/(.*)$ /$1 break;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /console/ {
    rewrite ^/console/(.*)$ /$1 break;
    try_files $uri $uri/ @console_index;
  }

  location @console_index {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location / {
    return 404;
  }
}
