map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name ${PUBLIC_HOSTNAME};

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    return 204;
  }

  location /internal/ {
    limit_req zone=api_rate burst=40 nodelay;
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $http_x_request_id;
  }

  # 模型网关（OpenAI 兼容端点，Bearer API Key 鉴权）。
  # 1) 超时必须放宽：默认 proxy_read_timeout 60s 时上游空闲超 60s 即断流
  #    （实测 70s 空闲在 +60.07s 被切断），LLM 首 token 等待会稳定踩中。
  # 2) 刻意不套 limit_req：nginx 的限流拒绝返回 503 + text/html，会破坏 OpenAI 错误信封；
  #    /v1 的配额与限流由网关按 Key 维度执行，返回标准 429 + OpenAI 信封。
  #    未携带有效 Key 的洪泛防护由网关的 IP 级预检承担（见 PRD 8.3）。
  location /v1/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $http_x_request_id;
  }

  location = /console {
    return 308 /console/;
  }

  location ~ ^/(login|marketplace|applications|innovation|analytics|organization|security|notifications|creator|assistant)(?:/|$) {
    return 308 /console$request_uri;
  }

  location /console/ {
    proxy_pass http://web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
