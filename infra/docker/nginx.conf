server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $api_upstream "api:3001";
  set $web_upstream "${WEB_UPSTREAM}";

  location = /healthz {
    access_log off;
    return 204;
  }

  location /internal/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 模型网关（OpenAI 兼容端点，Bearer API Key 鉴权）。
  # 超时必须放宽：默认 proxy_read_timeout 60s 时上游空闲超 60s 即断流
  # （实测 70s 空闲在 +60.07s 被 nginx 切断），LLM 首 token 等待会稳定踩中。
  location /v1/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /console {
    return 308 /console/;
  }

  location ~ ^/(login|marketplace|applications|innovation|analytics|organization|security|notifications|creator|assistant)(?:/|$) {
    return 308 /console$request_uri;
  }

  location /console/ {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
