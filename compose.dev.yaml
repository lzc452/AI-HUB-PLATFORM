services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  garage:
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"

  api:
    build:
      target: development
    command: ["sh", "-c", "pnpm migrate && exec pnpm --filter @ai-hub/api dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./packages/config/src:/workspace/packages/config/src
      - ./packages/contracts/src:/workspace/packages/contracts/src
      - ./packages/database/src:/workspace/packages/database/src
      - ./packages/server/src:/workspace/packages/server/src

  worker:
    build:
      target: development
    command: ["pnpm", "--filter", "@ai-hub/worker", "dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/worker/src:/workspace/apps/worker/src
      - ./packages/config/src:/workspace/packages/config/src
      - ./packages/contracts/src:/workspace/packages/contracts/src
      - ./packages/database/src:/workspace/packages/database/src
      - ./packages/server/src:/workspace/packages/server/src

  web:
    build:
      target: development
    command: ["pnpm", "--filter", "@ai-hub/web", "dev", "--host", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
    volumes:
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/src:/workspace/apps/web/src
      - ./packages/ui/src:/workspace/packages/ui/src

  proxy:
    environment:
      WEB_UPSTREAM: web:5173
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
