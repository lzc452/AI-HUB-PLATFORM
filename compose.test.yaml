name: ai-hub-platform-test

services:
  prometheus:
    profiles: ["application"]

  api:
    profiles: ["application"]

  worker:
    profiles: ["application"]

  web:
    profiles: ["application"]

  proxy:
    profiles: ["application"]

  test:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: test
    command: ["pnpm", "verify"]
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      COOKIE_SECRET: ai-hub-test-cookie-secret-at-least-32-characters
      DATABASE_URL: postgres://ai_hub:ai_hub_test@postgres:5432/ai_hub_test
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://ai_hub:ai_hub_test@postgres:5432/ai_hub_test
    depends_on:
      clamav:
        condition: service_healthy
      garage:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - application

  clamav:
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"

  postgres:
    environment:
      POSTGRES_DB: ai_hub_test
      POSTGRES_PASSWORD: ai_hub_test
      POSTGRES_USER: ai_hub

networks:
  application:
    internal: true
